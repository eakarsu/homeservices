<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline field notebook — ServiceCrew</title>
<style>body{font:16px system-ui;max-width:900px;margin:30px auto;padding:0 20px;background:#f8fafc;color:#172033}article{background:white;border:1px solid #cbd5e1;border-radius:12px;padding:20px;margin:16px 0}textarea{box-sizing:border-box;width:100%;min-height:140px;margin:8px 0;padding:10px}button,a{margin:8px 8px 8px 0}button{padding:10px 16px;border:1px solid #94a3b8;border-radius:6px;cursor:pointer}label{display:block;margin:10px 0}.error{color:#b91c1c}.muted{color:#475569;font-size:14px}img{max-width:180px;max-height:140px}button:disabled{opacity:.5}</style>
<h1>Offline field notebook</h1><p>Edit saved job drafts on this device. Synchronization requires your original account and an unchanged job. Drafts never mark jobs complete or charge customers.</p><a href="/dashboard/jobs">Back to jobs</a><a href="/login">Sign in</a><p id="status" role="status"></p><main id="drafts"></main>
<script>
const owner=sessionStorage.getItem('homeservices-field-owner');let db;
function node(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function stored(mode,fn){return new Promise((resolve,reject)=>{const tx=db.transaction('drafts',mode);let value;const req=fn(tx.objectStore('drafts'));req.onsuccess=()=>value=req.result;tx.oncomplete=()=>resolve(value);tx.onerror=()=>reject(tx.error)})}
async function save(d){await stored('readwrite',s=>s.put(d))}
function error(e){document.getElementById('status').textContent=e.message||'Unable to save draft'}
async function render(){const root=document.getElementById('drafts');root.replaceChildren();const rows=(await stored('readonly',s=>s.getAll())).filter(d=>d.ownerId===owner);if(!rows.length)root.append(node('p','No drafts for this session. Open a job while connected and select “Save for offline work”.'));
for(const d of rows){const card=node('article'),h=node('h2',d.title),meta=node('p','Saved '+new Date(d.createdAt).toLocaleString()),work=node('textarea');meta.className='muted';work.value=d.payload.workPerformed||'';work.maxLength=20000;work.setAttribute('aria-label','Work performed');card.append(h,meta,node('label','Work performed'),work);let saving=Promise.resolve(),syncing=false;const controls=[];
function persist(){d.requestKey=crypto.randomUUID();saving=saving.then(()=>save(d));saving.catch(error)}
work.oninput=()=>{d.payload.workPerformed=work.value;persist()};controls.push(work);
for(const item of d.payload.items||[]){const label=node('label'),box=node('input'),note=node('input');box.type='checkbox';box.checked=item.checked;box.onchange=()=>{item.checked=box.checked;persist()};note.value=item.notes||'';note.placeholder='Checklist evidence';note.setAttribute('aria-label',item.label+' evidence');note.maxLength=2000;note.oninput=()=>{item.notes=note.value;persist()};label.append(box,document.createTextNode(' '+item.label+' '),note);card.append(label);controls.push(box,note)}
const photoLabel=node('label','Add PNG or JPEG photos (up to five, 1 MB total)'),file=node('input');file.type='file';file.accept='image/png,image/jpeg';file.multiple=true;controls.push(file);photoLabel.append(file);card.append(photoLabel);
file.onchange=async()=>{try{let total=d.payload.photos.reduce((sum,p)=>sum+p.media.length*.75,0);for(const f of file.files){total+=f.size;if(total>1000000||d.payload.photos.length>=5)throw Error('Use up to five photos totaling 1 MB');if(!['image/png','image/jpeg'].includes(f.type))throw Error('Use PNG or JPEG');const media=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});d.payload.photos.push({media,type:'DURING',caption:f.name.slice(0,1000)})}persist();await saving;await render()}catch(e){error(e);persist()}};
for(const [i,p] of d.payload.photos.entries()){const img=node('img'),remove=node('button','Remove photo');img.src=p.media;img.alt=p.caption||'Offline job photo';remove.onclick=async()=>{d.payload.photos.splice(i,1);persist();await saving;await render()};card.append(img,remove);controls.push(remove)}
const consent=node('label'),check=node('input');check.type='checkbox';check.checked=d.payload.photoConsent;check.onchange=()=>{d.payload.photoConsent=check.checked;persist()};consent.append(check,document.createTextNode(' I am authorized to store these job photos.'));card.append(consent);controls.push(check);
const sync=node('button','Review complete — sync draft'),discard=node('button','Delete local draft'),message=node('p');message.setAttribute('role','status');controls.push(sync,discard);sync.onclick=async()=>{if(syncing)return;syncing=true;controls.forEach(e=>e.disabled=true);try{await saving;const session=await fetch('/api/auth/session',{cache:'no-store'}).then(r=>r.json());if(session.user?.id!==d.ownerId)throw Error('Sign in with the account that saved this draft. Your work is retained.');if(d.payload.photos.length&&!d.payload.photoConsent)throw Error('Confirm photo authorization before syncing.');const r=await fetch('/api/jobs/'+encodeURIComponent(d.jobId)+'/offline-sync',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':d.requestKey},body:JSON.stringify(d.payload)}),v=await r.json();if(!r.ok)throw Error(v.error||'Sync failed');await stored('readwrite',s=>s.delete(d.id));document.getElementById('status').textContent='Work synchronized successfully.';await render()}catch(e){message.textContent=e.message;message.className='error'}finally{syncing=false;controls.forEach(e=>e.disabled=false)}};
discard.onclick=async()=>{if(confirm('Delete this local draft? Unsynchronized changes will be lost.')){await saving;await stored('readwrite',s=>s.delete(d.id));await render()}};card.append(sync,discard,message);root.append(card)}}
const request=indexedDB.open('homeservices-field-v1',1);request.onupgradeneeded=()=>request.result.createObjectStore('drafts',{keyPath:'id'});request.onsuccess=()=>{db=request.result;render().catch(error)};request.onerror=()=>error(request.error);
</script></html>
